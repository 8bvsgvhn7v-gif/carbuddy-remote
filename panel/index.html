<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>CarBuddy Panel</title>
<!--
  CarBuddy Panel: a web page for Chrome / Edge on Windows,
  macOS and Linux. It talks to the board over the USB cable with Web Serial, using the firmware's
  line console (README, "Serial console") - the same commands and the same parsing as the Mac app.
  index.html?demo simulates a board, so every part of the page can be tried without hardware.
  Face previews: faces/*.gif + faces.json (faces/catalog.js for file://), made by build.sh.
-->
<style>
:root{--bg:#000;--panel:#0b0e10;--card:#15191c;--card2:#1b2024;--line:#262d33;--ink:#eef3f5;--dim:#8a979f;--dim2:#5d686f;
  --acc:#1ee0f0;--accInk:#02191c;--warn:#ff6b5e;--pink:#ff7ab6;--purple:#b88cff;--blue:#4ea3ff;--orange:#ffa64d;--green:#4ade80}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;min-width:980px;overflow:hidden}
button{font:inherit;border:0;border-radius:10px;padding:7px 12px;background:#262d33;color:var(--ink);cursor:pointer}
button:hover:not(:disabled){background:#313a41}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--acc);color:var(--accInk);font-weight:600}
button.primary:hover:not(:disabled){background:#5beaf6}
button.small{padding:5px 10px;font-size:13px}
input[type=text],input[type=search],input[type=password],input:not([type]),select{font:inherit;background:#1b2024;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none;min-width:0}
input[type=text]:focus,input[type=search]:focus,input[type=password]:focus,input:not([type]):focus,select:focus{border-color:var(--acc)}
input[type=range]{accent-color:var(--acc);width:150px}
h2{font-size:18px;font-weight:600;margin:0 0 10px}
h2 .count{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--dim);margin-left:8px;font-weight:400}
.note{color:var(--dim);margin:0 0 10px;max-width:980px}
.hidden{display:none!important}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}

/* Header */
header{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.eyes{display:flex;gap:5px;align-items:flex-end;height:22px;cursor:default}
/* Asleep like on the board (Eye.cpp, Asleep): a straight line low in the eye that rises and thickens
   with each breath (3.1 s, a short rest at the bottom). */
.eyes i{width:16px;height:3px;border-radius:2px;background:var(--acc);box-shadow:0 0 6px #1ee0f055;
  transition:height .45s cubic-bezier(.3,1.7,.5,1),border-radius .3s,box-shadow .3s;animation:cbSleep 3.1s linear infinite}
@keyframes cbSleep{0%,90.3%,100%{transform:translateY(-2px);height:3px;animation-timing-function:ease-in-out}45%{transform:translateY(-6px);height:4px;animation-timing-function:ease-in-out}}
body.online .eyes i{height:18px;border-radius:6px;box-shadow:0 0 10px #1ee0f088;animation:none;transform:none}
body.online .eyes.glad i{animation:cbHop .9s ease-out;-webkit-mask:radial-gradient(ellipse 75% 62% at 50% 112%,transparent 97%,#000 100%);mask:radial-gradient(ellipse 75% 62% at 50% 112%,transparent 97%,#000 100%)}
body.online .eyes.blink i{height:2px}
@keyframes cbHop{0%{transform:none}25%{transform:translateY(-5px)}45%{transform:none}65%{transform:translateY(-3px)}100%{transform:none}}
.brand b{display:block;font-size:16px}.brand span{color:var(--dim);font-size:12px}
.status{display:flex;gap:18px;margin-left:auto}
.status div{display:flex;flex-direction:column}.status small{color:var(--dim);font-size:11px}.status span{font-variant-numeric:tabular-nums}
.banner{padding:9px 14px;background:#3a1c18;color:#ffd2cc;border-bottom:1px solid #5a2a24}
.banner a{color:var(--acc)}
.brand .demo-tag{font-size:11px;font-weight:600;background:var(--purple);color:#1a0f2e;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}

/* Main split */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,30vw,440px);min-height:0}
.left{display:flex;flex-direction:column;min-height:0;min-width:0}
body.owner aside,body.owner #status{display:none!important}
dialog.gate{max-width:min(520px,calc(100vw - 32px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px}
dialog.gate::backdrop{background:#000b}
dialog.gate h3{margin:0 0 10px;font-size:20px}
dialog.gate p{color:var(--dim);margin:0 0 12px;line-height:1.5}dialog.gate p b{color:var(--ink)}
dialog.gate label{display:flex;align-items:center;gap:12px;margin:16px 0 18px;cursor:pointer;color:var(--ink)}
dialog.gate label input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
dialog.gate label input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .2s}
dialog.gate label input:checked{background:var(--acc)}dialog.gate label input:checked::after{transform:translateX(18px);background:var(--accInk)}
dialog.gate .btnrow{justify-content:flex-end}
button.dev{font-weight:700;letter-spacing:.08em}
body.owner .main{grid-template-columns:minmax(0,1fr)}
body.owner #scroll>.panel{max-width:860px}
nav{display:flex;flex-wrap:wrap;gap:3px;margin:12px;padding:3px;background:#1b2024;border-radius:11px}
nav button{flex:0 0 auto;background:none;padding:6px 8px;font-size:13px;white-space:nowrap}
nav button.on{background:#4a545c}
.scroll{flex:1;overflow:auto;padding:0 12px 24px}
.panel>*+*{margin-top:22px}

/* Cards */
.grid{display:grid;gap:12px}
.actions{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.acard{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
.acard .txt{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.acard b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when small{display:block;font-size:10px;font-weight:600;color:var(--acc);letter-spacing:.04em}
.when span{color:var(--dim)}
.acard .go{margin-top:auto;align-self:flex-start}
.bezel{flex:none;background:#333;padding:4px;border-radius:15px}
.screen{display:block;background:#000;border-radius:12px;overflow:hidden;object-fit:contain}
.acard .bezel{align-self:flex-start}
.acard .screen{width:90px;height:105px}
.gallery{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.fcard{display:flex;flex-direction:column;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:440px}
.fcard:hover{border-color:var(--acc)}
.fcard .bezel{align-self:center;padding:6px;border-radius:24px}
.fcard .screen{width:156px;height:182px;border-radius:18px}
.fcard .head{display:flex;align-items:center;gap:6px}
.badge{font:600 11px ui-monospace,Menlo,Consolas,monospace;background:var(--acc);color:var(--accInk);border-radius:5px;padding:1px 5px}
.fcard .id{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}
.fcard .go{margin-top:auto;width:100%}
.pads{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.pads button{text-align:left;padding:11px 12px;background:var(--card);border:1px solid var(--line)}
.pads button:hover:not(:disabled){background:var(--card2)}
.pads button .ic{display:inline-block;width:22px;color:var(--acc)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.info{background:#0f3236;border-radius:10px;padding:10px 12px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.btnrow button.on{background:#4a545c}
.slots{display:grid;gap:6px;margin-top:10px}
.slotrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slotrow input{background:#15191c;color:inherit;border:1px solid #333a40;border-radius:6px;padding:4px 6px}

/* Bars */
.bars{display:flex;flex-direction:column;gap:6px}
.barrow{display:flex;align-items:center;gap:10px}
.barrow .lbl{width:130px;flex:none}
.bar{width:260px;height:8px;background:#323b42;border-radius:5px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .4s}
.bar.purple i{background:var(--purple)}.bar.blue i{background:var(--blue)}
.num{font-variant-numeric:tabular-nums;width:70px;text-align:right;flex:none}
.chip{font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px}
.lv0{background:#8a979f40}.lv1{background:#4ea3ff40}.lv2{background:#ffa64d40}
.flag{margin-top:8px}.flag.orange{color:var(--orange)}

/* Relations */
.rel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rel .top{display:flex;align-items:center;gap:12px}
.rel .name{width:110px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:#262d33;border-radius:10px;padding:3px;gap:3px;width:360px}
.seg button{flex:1;padding:5px 6px;background:none;font-size:13px}
.seg button.on{background:#4a545c}
.sliders{display:flex;gap:18px}
.sliders label{display:flex;flex-direction:column;font-size:12px;color:var(--dim)}
.gift{color:var(--pink);font-size:12px}

/* Drawings */
.drawings{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.dcard{display:flex;flex-direction:column;gap:3px}
.paper{position:relative;height:130px;background:rgb(33,56,46);border-radius:10px;overflow:hidden}
.paper canvas{width:100%;height:100%;display:block}
.paper span{position:absolute;top:6px;right:7px;font-size:11px;color:#ffffff99;font-variant-numeric:tabular-nums}
.dcard b{font-size:13px}.dcard small{color:var(--dim);font-size:12px}.dcard em{color:var(--dim2);font-size:11px;font-style:normal}

/* Log */
aside{display:flex;flex-direction:column;gap:6px;padding:10px;border-left:1px solid var(--line);background:var(--panel);min-height:0}
.vscreen{display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.vscreen .screen{width:150px;height:175px}.vscreen small{color:var(--dim)}
.row{display:flex;gap:6px}.row input{flex:1}
#log{flex:1;overflow:auto;background:#06080a;border:1px solid var(--line);border-radius:9px;padding:6px 8px;
  font:11.5px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);user-select:text}
#log div{white-space:pre-wrap;word-break:break-word}
#log .out{color:#6fd3ff}#log .hl{color:var(--ink)}#log .app{color:var(--purple)}

/* Dialog + toast */
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:10}
.modal .dlg{background:#1b2024;border:1px solid var(--line);border-radius:14px;padding:18px 20px;width:440px;box-shadow:0 20px 60px #000}
.modal h3{margin:0 0 8px;font-size:16px}.modal p{margin:0;color:#c7d0d5;white-space:pre-line}
.modal .btnrow{justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#262d33;padding:9px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:11}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="eyes"><i></i><i></i></div>
  <div class="brand"><b>CarBuddy Panel<span id="demoTag" class="demo-tag hidden">DEMO</span></b><span id="connText">Niepołączony</span></div>
  <button class="primary" id="connect">Połącz przez USB</button>
  <div class="status hidden" id="status">
    <div><small>Nastrój</small><span id="stMood">–</span></div>
    <div><small>Jazda</small><span id="stDrive">–</span></div>
    <div><small>Mina</small><span id="stFace">–</span></div>
    <div><small>Kierowca</small><span id="stDriver">–</span></div>
    <div><small>FPS</small><span id="stFps">–</span></div>
  </div>
</header>
<div class="banner hidden" id="noSerial">
  Ta przeglądarka nie obsługuje Web Serial (połączenia przez kabel USB). Otwórz panel w <b>Chrome</b> albo <b>Edge</b>
  na Windows, macOS lub Linuksie. Bez płytki możesz wypróbować <a href="?demo">tryb demo</a>.
</div>
<div class="main">
  <section class="left">
    <nav id="tabs"></nav>
    <div class="scroll" id="scroll"></div>
  </section>
  <aside>
    <div class="vscreen hidden" id="vscreen"><div class="bezel"><canvas class="screen" id="vcanvas"></canvas></div>
      <small>Wirtualny CarBuddy – to samo, co pokazałaby płytka</small></div>
    <div class="row"><input type="search" id="filter" placeholder="Szukaj w logu"><button id="clear">Wyczyść</button></div>
    <div id="log"></div>
    <div class="row"><input type="text" id="cmd" placeholder="Komenda konsoli (np. b, E 7, T 2026-10-30 12:00:00)"><button id="sendCmd">Wyślij</button></div>
  </aside>
</div>
<input type="file" id="soulFile" accept=".txt,text/plain" class="hidden">
<div class="toast" id="toast"></div>
<script src="faces/catalog.js"></script>
<script src="face/carbuddy-face-view.js"></script>
<script>
"use strict";
const DEMO = new URLSearchParams(location.search).has("demo");
// Three levels (remembered in this browser; "?prog" / "?dev" force one):
//   owner - the bare minimum: drivers and settings;
//   prog  - programmer: console, log, live readouts, every setting and debug tool, but nothing that
//           shows his faces or plays his behaviours;
//   dev   - everything, spoilers included (behind a warning).
const LEVEL_KEY = "carbuddy.panel.level";
const LEVELS = ["owner", "prog", "dev"];
let LEVEL = "owner";
try { const v = localStorage.getItem(LEVEL_KEY); if (LEVELS.includes(v)) LEVEL = v; } catch {}
{ const q = new URLSearchParams(location.search); if (q.has("prog")) LEVEL = "prog"; if (q.has("dev")) LEVEL = "dev"; }
const DEV = LEVEL === "dev";
const $ = id => document.getElementById(id);

// Small DOM builder: text always goes in as text (names come from the board).
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("show"), 1800); }

// ---------------------------------------------------------------------------------------------
// Polish names (from the Mac app)
const emotionPL = {
  "neutral": "Spokój", "happy": "Zadowolony", "sleepy": "Błogość", "curious": "Zaciekawiony", "thinking": "Zamyślony",
  "surprised": "Zaskoczony", "love": "Zakochany", "angry": "Zły", "excited": "Podekscytowany", "confused": "Zdezorientowany",
  "scared": "Przestraszony", "embarrassed": "Zawstydzony", "sad": "Smutny", "dizzy": "Zawroty", "ouch": "Au!",
  "asleep": "Śpi", "bored": "Znudzony", "annoyed": "Poirytowany", "startled": "Wystraszony", "sneeze": "Kichnięcie",
  "strain": "Napięcie", "shake-off": "Otrząsa się", "drowsy": "Senny", "petted": "Głaskany", "savor": "Rozkoszuje się",
  "rattled": "Wstrząśnięty", "joy": "Radość ^^", "hi": "Hi!", "relaxed": "Rozluźniony", "attentive": "Uważny",
  "waking": "Budzi się", "eyeroll": "Przewraca oczami", "queasy": "Mdli go", "scheming": "Knuje", "hiccup": "Czkawka",
  "shy": "Nieśmiały", "reproach": "Wyrzut", "playdead": "Udaje martwego", "sleeppeek": "Jedno oko przez sen",
  "grumpy": "Marudny", "tired": "Zmęczony", "dreamy": "Maślane oczy",
};
const moodPL = { "content": "Zadowolony", "cheerful": "Wesoły", "grumpy": "Marudny", "sleepy": "Śpiący", "bored": "Znudzony", "smitten": "Zauroczony" };
const drivePL = { "parked": "parking", "stop": "światła", "jam": "korek", "city": "miasto", "highway": "autostrada", "twisty": "kręta droga" };

const hobbyWhen = "Na postoju albo w czasie jazdy, kiedy ma ochotę – im bardziej go to interesuje, tym częściej.";
// Repertoire: Polish name, preview face, what he does, when it happens.
const actInfo = {
  "glance": ["Zerknięcie", "curious", "Zerknięcie bez powodu (już nieużywane – rozglądaniem zajmuje się teraz system uwagi).", "—"],
  "look at driver": ["Spojrzenie na kierowcę", "neutral", "Jak drugi pilot sprawdza, co u ciebie; czasem lekko się uśmiechnie.", "Co jakiś czas; na autostradzie rzadziej."],
  "wink": ["Oczko", "x-wink", "Puszcza oczko.", "Tylko jako odpowiedź (np. po głaskaniu)."],
  "daydream": ["Buja w obłokach", "thinking", "Patrzy w górę, zamyślony, czasem westchnie.", "Na postojach, kiedy się nudzi."],
  "cold sneeze": ["Kichnięcie z zimna", "sneeze", "Brrr, a-a-apsik; rozbawiony albo zirytowany zależnie od nastroju.", "Zimno w aucie (gdy ma czujnik temperatury)."],
  "hot, wipes sweat": ["Upał, ociera pot", "x-hot", "Ciężkie powieki, strząsa pot.", "Gorąco w aucie (gdy ma czujnik temperatury)."],
  "bored passenger": ["Znudzony pasażer", "bored", "Wzdycha, patrzy w okno, ziewa.", "Ponad 15 minut na autostradzie albo w korku."],
  "are we there yet": ["Daleko jeszcze?", "bored", "Ty, droga, ty… i westchnienie. Bez słów.", "Po godzinie jazdy."],
  "warm and drowsy": ["Ciepło i sennie", "drowsy", "Oczy się kleją, potem się otrząsa.", "Ciepło i postój."],
  "wants attention": ["Zaczepia", "excited", "Zerka na ciebie, robi minę, a jak nikt nie reaguje – zajmuje się sobą.", "Na światłach albo na postoju, gdy dawno go nie dotykałeś."],
  "not dancing (honest)": ["Wcale nie tańczę", "x-groove", "Zaczyna się kiwać, przyłapany zamiera i udaje, że nic się nie stało.", "Gra muzyka, a on nie tańczy."],
  "car-sick": ["Choroba lokomocyjna", "queasy", "Zielenieje, oczy się chwieją.", "Długa kręta droga."],
  "hiccups": ["Czkawka", "hiccup", "Hik! hik! – potem zirytowany.", "Po wybojach albo po śmiechu."],
  "random sneeze": ["Kichnięcie bez powodu", "sneeze", "Kichnięcie znikąd (już nieużywane).", "—"],
  "highway nap": ["Drzemka na autostradzie", "drowsy", "Przysypia i nagle się budzi.", "Długa, spokojna autostrada, mało energii."],
  "plays dead": ["Udaje martwego", "playdead", "Teatralnie „umiera”, podgląda jednym okiem i woła „mam cię!”.", "Tylko na parkingu; częściej po trasie z ostrym hamowaniem."],
  "hide and seek": ["W chowanego", "x-hide", "Chowa się za krawędź ekranu i zerka; stuknij, żeby go znaleźć.", "Tylko na parkingu, rzadko."],
  "scheming": ["Knuje", "scheming", "Zmrużone oko (sam z siebie już tego nie robi).", "—"],
  "happy memory": ["Szczęśliwe wspomnienie", "excited", "Patrzy w górę, potem rozpromienia się.", "Na postoju, w dobrym humorze."],
  "blows a kiss": ["💋 Cyfrowy buziak", "kiss", "„Cmok!” – w twoją stronę leci pikselowe serduszko, potem oczko.", "Bardzo rzadko: bardzo bliska więź z właścicielem i świetny nastrój."],
  "hobby: butterflies": ["Hobby: motyle", "h-butterfly-0", "Bawi się z motylem: śledzi go wzrokiem, próbuje złapać, czasem motyl siada mu na oku.", hobbyWhen],
  "hobby: stars": ["Hobby: gwiazdy", "h-stars-0", "Patrzy w gwiazdy, liczy je i czeka na spadającą.", hobbyWhen],
  "hobby: bubbles": ["Hobby: bańki", "h-bubbles-0", "Dmucha bańki i patrzy, jak lecą i pękają.", hobbyWhen],
  "hobby: ladybug": ["Hobby: biedronka", "h-ladybug-0", "Biedronka spaceruje po krawędzi ekranu i wchodzi mu na oko.", hobbyWhen],
  "hobby: drawing": ["Hobby: rysowanie", "h-drawing-0", "Rysuje serce, gwiazdkę albo autoportret; z wprawą coraz równiej.", hobbyWhen],
  "hobby: magic": ["Hobby: magia", "h-magic-0", "Czaruje gwiazdkę: znika i wraca – albo nie wychodzi.", hobbyWhen],
  "hobby: garden": ["Hobby: ogród", "h-garden-0", "Zagląda do swojej roślinki i ją podlewa.", hobbyWhen],
  "nightmare": ["Koszmar", "scared", "Przez sen drga, budzi się przestraszony, rozgląda, zasypia.", "Bardzo rzadko w czasie snu; częściej po nerwowej trasie."],
};
const moodInfo = {
  "content": ["Zadowolony", "neutral", "Spokojna mina, bez żadnych dodatków.", "Domyślnie."],
  "cheerful": ["Wesoły", "happy", "Większe, jasne oczy; od czasu do czasu „nuci” (podskakuje) i rzuca ci uśmiechy.", "Po miłych chwilach: dotyku, spokojnej jeździe, muzyce."],
  "grumpy": ["Marudny", "grumpy", "Powieki do połowy, unika twojego wzroku: zerknie i zaraz odwraca oczy; wzdycha, pomrukuje.", "Seria ostrych hamowań i dziur albo gdy ktoś go ignoruje."],
  "sleepy": ["Śpiący", "tired", "Ciężkie powieki, wzrok nisko; przysypia i się ocyka, ziewa.", "Mało energii, częściej w nocy."],
  "bored": ["Znudzony", "bored", "Oczy nisko, wzrok w dół; wzdycha, patrzy w górę i przez okno.", "Długi postój bez zajęcia."],
  "smitten": ["Zauroczony", "dreamy", "Maślane oczy; najczęściej patrzy na ciebie i robi powolne „kocie” mrugnięcie, czasem serduszka.", "Po długim głaskaniu albo przy kimś, kogo darzy sympatią."],

// ---------------------------------------------------------------------------------------------
// The board: state parsed from its lines (as in the Mac app's Board)
const B = {
  connected: false,
  emotions: [], acts: [], moods: [],
  state: {}, hobbies: {}, garden: {}, dreams: {},
  relations: {},                    // person -> {p, style, shy, romance, showoff, gift, name}
  drivers: {},                      // person -> {p, active, phones, phone, name} ("@ app")
  pairing: null,                    // {p, until}: the pairing window he has open
  drawings: { total: 0, list: [] }, // his drawings, newest first ("o d")
  ota: {},                          // firmware updates ("@ ota"): version, build, state, progress, new, wifi, msg
  festive: {},                      // holidays ("@ festive"): today, showing, country, birthdays
  accessory: "",                    // what he wears on his head ("[acc] wearing=")
};
let otaPoll = null;
let pendingDrawings = [];
let soulLines = null, soulName = null;  // his memory being exported ("# export" -> "[soul] ..." until "end")
let soulOut = [], soulSent = 0;          // his memory being imported: lines still to send, one per "[soul] ok"
let generation = 0;                      // bumped on every connect / disconnect: delayed sends check it
let link = null;                         // {kind, write(text), close()}
let poll = null;

// "key=value key=value ..."; `tail` is a key that is always last and may contain spaces (a name).
function fields(s, tail) {
  const d = {};
  if (tail) {
    if (s.startsWith(tail + "=")) { d[tail] = s.slice(tail.length + 1); s = ""; }
    else {
      const i = s.indexOf(" " + tail + "=");
      if (i >= 0) { d[tail] = s.slice(i + tail.length + 2).trim(); s = s.slice(0, i); }
    }
  }
  for (const part of s.split(" ")) {
    if (!part) continue;
    const i = part.indexOf("=");
    if (i > 0 && i < part.length - 1) d[part.slice(0, i)] = part.slice(i + 1);
  }
  return d;
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
// The garden's poll reply (the other "[garden]" lines are events).
const isGardenPoll = line => line.startsWith("[garden] planted=") && line.includes(" stage=") && !line.includes(" dry=");

function send(command, quiet = false) {
  if (!link || !B.connected) return;
  link.write(command + "\n", command);
  if (!quiet) append("> " + command);
}
// Sends after a delay, but only if still on the same connection.
function sendLater(delay, command, quiet = false) {
  const gen = generation;
  setTimeout(() => { if (gen === generation && B.connected) send(command, quiet); }, delay * 1000);
}

// "[ota] version=..": msg (last) and the Wi-Fi name may both contain spaces.
function otaFields(s) {
  const m = s.indexOf(" msg="), msg = m >= 0 ? s.slice(m + 5) : "";
  const d = fields(m >= 0 ? s.slice(0, m) : s, "wifi");
  d.msg = msg;
  return d;
}

function handle(line) {
  if (line.startsWith("[soul] ")) { soulLine(line.slice(7)); return; }
  if (line.startsWith("[ota] version=")) {
    const v = otaFields(line.slice(6));
    clearTimeout(otaPoll);  // while it's busy, ask again every 2 s for the progress
    if (["1", "2", "3", "4"].includes(v.state)) otaPoll = setTimeout(() => send("@ ota", true), 2000);
    if (!same(v, B.ota)) { B.ota = v; renderOta(); append(line); }
    return;
  }
  if (line.startsWith("[acc] wearing=")) { B.accessory = line.slice(14).trim(); renderAccessory(); return; }
  if (line.startsWith("[festive] today=")) { const v = fields(line.slice(10)); if (!same(v, B.festive)) { B.festive = v; renderFestive(); } append(line); return; }
  if (line.startsWith("[bri] ")) { const v = fields(line.slice(6)); if (!same(v, B.bri)) { B.bri = v; renderBrightness(); } return; }
  if (line.startsWith("[hobby] drawing done")) sendLater(0.5, "o d", true);  // a new drawing for the gallery
  if (line.startsWith("[state] ")) { const v = fields(line.slice(8), "driver"); if (!same(v, B.state)) { B.state = v; renderState(); } return; }
  if (isGardenPoll(line)) { const v = fields(line.slice(9)); if (!same(v, B.garden)) { B.garden = v; renderGarden(); } return; }
  if (line.startsWith("[drawings] total=")) { B.drawings.total = parseInt(line.slice(17)) || 0; pendingDrawings = []; return; }
  if (line === "[drawings] end") { B.drawings.list = pendingDrawings; pendingDrawings = []; renderDrawings(); return; }
  if (line.startsWith("[drawing] n=")) { const d = parseDrawing(line); if (d) pendingDrawings.push(d); return; }
  if (line.startsWith("[driver] p=")) {
    const d = fields(line.slice(9), "name"), p = parseInt(d.p);
    if (p >= 0 && p < PEOPLE && !same(B.drivers[p], d)) { B.drivers[p] = d; renderPhones(); }
  }
  {
    const open = /^\[phone\] pairing open for driver (\d)/.exec(line), done = /^\[phone\] .* paired for driver (\d)/.exec(line);
    if (open) { B.pairing = { p: +open[1], until: Date.now() + 120000 }; renderPhones(); setTimeout(renderPhones, 120500); }
    if (line === "[phone] pairing window closed") { B.pairing = null; renderPhones(); }
    if (done) { B.pairing = null; sendLater(0.5, "@ app", true); renderPhones(); toast("Telefon sparowany"); }
  }
  if (line.startsWith("[relation] p=")) {
    const d = fields(line.slice(11), "name"), p = parseInt(d.p);
    if (p >= 0 && p < PEOPLE && !same(B.relations[p], d)) { B.relations[p] = d; renderRelation(p); renderFestive(); }
    return;
  }
  if (line.startsWith("[dreams] dreaming=")) { const v = fields(line.slice(9)); if (!same(v, B.dreams)) { B.dreams = v; renderDreams(); } return; }
  if (line.startsWith("[hobbies] ")) { const v = fields(line.slice(10)); if (!same(v, B.hobbies)) { B.hobbies = v; renderHobbies(); } return; }
  if (line.startsWith("[emotions] ")) { const v = line.slice(11).split("|").filter(Boolean); if (!same(v, B.emotions)) { B.emotions = v; updateGalleryButtons(); } }
  if (line.startsWith("[acts] ")) { const v = line.slice(7).split("|").filter(Boolean); if (!same(v, B.acts)) { B.acts = v; renderActs(); updateGalleryButtons(); } }
  if (line.startsWith("[moods] ")) { const v = line.slice(8).split("|").filter(Boolean); if (!same(v, B.moods)) { B.moods = v; renderMoods(); } }
  append(line);
}

// His soul (memory export / import, see src/memory/Soul.h)
// The computer's time zone for "@ zone": minutes from UTC now, and without summer time.
function zoneCommand(d = new Date()) {
  const y = d.getFullYear(), std = -Math.max(new Date(y, 0, 1).getTimezoneOffset(), new Date(y, 6, 1).getTimezoneOffset());
  return `@ zone ${-d.getTimezoneOffset()} ${std}`;
}
function stamp(d = new Date()) {
  const z = n => String(n).padStart(2, "0");
  return { day: `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`, hm: `${z(d.getHours())}${z(d.getMinutes())}`,
           time: `${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}` };
}
function exportSoul() {
  if (!B.connected) return;
  const s = stamp();
  soulLines = [];
  soulName = `CarBuddy pamięć ${s.day} ${s.hm}.txt`;
  append("[app] saving his memory…");
  send("# export");
  const gen = generation;
  setTimeout(() => {
    if (gen !== generation || soulLines === null) return;
    soulLines = null;
    tell("Nie udało się zapisać pamięci", "CarBuddy nie odpowiedział do końca. Spróbuj jeszcze raz.");
  }, 15000);
}
async function importSoul(file) {
  let text;
  try { text = await file.text(); } catch { tell("Nie da się odczytać pliku", file.name); return; }
  const lines = text.split(/\r?\n|\r/).map(l => l.trim()).filter(Boolean);
  if (!(lines.length >= 2 && lines[0].startsWith("begin ") && lines[lines.length - 1].startsWith("end ") &&
        lines.slice(1, -1).every(l => l.startsWith("p ")))) {
    tell("To nie jest plik z jego pamięcią", file.name);
    return;
  }
  const ok = await ask("Wczytać pamięć z pliku?",
    `To, co CarBuddy przeżył na tej płytce (charakter, profile, hobby, ogródek, rysunki, sny, relacje, ustawienia), zostanie zastąpione zawartością pliku ${file.name}. Płytka uruchomi się od nowa.\n\nKalibracja montażu, sparowane telefony i hasło Wi-Fi zostają bez zmian.`,
    "Wczytaj", "Anuluj");
  if (!ok || !B.connected) return;
  append(`[app] loading his memory from ${file.name} (${lines.length} lines)…`);
  // One line at a time: the board answers each, and its receive buffer is small.
  soulOut = lines.slice(1);
  soulSent = 0;
  send("# " + lines[0], true);
  watchSoulImport(0);
}
function sendNextSoulLine() {
  if (!soulOut.length) return;
  send("# " + soulOut.shift(), true);
  soulSent++;
  setImportProgress();
}
// No answer for 5 s: the board is gone or busy; say so instead of waiting for ever.
function watchSoulImport(progress) {
  const gen = generation;
  setTimeout(() => {
    if (gen !== generation || !soulOut.length) return;
    if (soulSent === progress) {
      soulOut = [];
      setImportProgress();
      tell("Nie udało się wczytać pamięci", "CarBuddy przestał odpowiadać. Nic nie zostało zmienione – spróbuj jeszcze raz.");
    } else watchSoulImport(soulSent);
  }, 5000);
}
function soulLine(body) {
  if (soulLines !== null) {
    if (body.startsWith("begin ")) soulLines = [];
    soulLines.push(body);
    if (!body.startsWith("end ")) return;
    const lines = soulLines;
    soulLines = null;
    download(soulName, lines.join("\n") + "\n");
    append(`[app] his memory saved: ${soulName} (downloaded)`);
    tell("Pamięć zapisana", `${soulName}\n\nCharakter, profile kierowców, hobby, ogródek, rysunki, sny, relacje, gatunki, log Yanosika i ustawienia.`);
    return;
  }
  if (body.startsWith("p ")) return;  // his memory itself (with artist names): never in the log
  if (body === "ok" || body === "import started") {
    sendNextSoulLine();
    if (body === "ok") return;
  }
  if (body.startsWith("import failed")) { soulOut = []; setImportProgress(); }
  append("[soul] " + body);
  if (body.startsWith("imported ")) {
    soulOut = []; setImportProgress();
    tell("Pamięć wczytana", "CarBuddy uruchamia się od nowa z wczytaną pamięcią.");
  } else if (body.startsWith("import failed")) {
    tell("Nie udało się wczytać pamięci", body.replace("import failed: ", ""));
  }
}
function setImportProgress() {
  const e = $("importProgress");
  if (!e) return;
  const total = soulSent + soulOut.length;
  e.textContent = soulOut.length ? `Wczytywanie pamięci: ${soulSent} / ${total} linii…` : "";
}
function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
  const a = el("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// Dialogs (not window.alert: that would stall the serial reading while it is open)
function dialog(title, text, buttons) {
  return new Promise(resolve => {
    const m = el("div", { class: "modal" });
    const close = v => { m.remove(); resolve(v); };
    const row = el("div", { class: "btnrow" }, buttons.map(([label, v, cls]) => el("button", { class: cls, onclick: () => close(v) }, label)));
    m.append(el("div", { class: "dlg", role: "dialog" }, el("h3", { text: title }), el("p", { text }), row));
    m.addEventListener("keydown", e => { if (e.key === "Escape") close(buttons[buttons.length - 1][1]); });
    document.body.append(m);
    row.lastChild.focus();
    if (buttons.length > 1) row.firstChild.focus();
  });
}
const tell = (title, text) => dialog(title, text, [["OK", true, "primary"]]);
const ask = (title, text, ok, cancel) => dialog(title, text, [[cancel, false, ""], [ok, true, "primary"]]).then(v => v === true);

// Transport: Web Serial (USB cable) or the demo board
const enc = new TextEncoder();
let serialPort = null, serialReader = null, serialWriter = null, readDone = null, writeChain = Promise.resolve();
let waitPort = null, waitTimer = null;  // a lost board we wait for (cable pulled, board reset)

function serialSupported() { return "serial" in navigator; }

async function connectClicked() {
  if (B.connected || waitPort) { await disconnect(); return; }
  if (DEMO) { openDemo(); return; }
  if (!serialSupported()) { $("noSerial").classList.remove("hidden"); return; }
  let port;
  try { port = await navigator.serial.requestPort(); }
  catch (e) { if (e.name !== "NotFoundError") append(`[app] no port chosen: ${e.message || e}`); return; }
  await openSerial(port);
}

function portName(port) {
  const i = port.getInfo ? port.getInfo() : {};
  const hex = n => n.toString(16).padStart(4, "0");
  return i.usbVendorId != null ? `USB ${hex(i.usbVendorId)}:${hex(i.usbProductId)}` : "port szeregowy";
}

async function openSerial(port, again = false) {
  try {
    // A big buffer: drawings and the memory export come as bursts of long lines.
    await port.open({ baudRate: 115200, bufferSize: 65536 });
  } catch (e) {
    if (again) return false;  // still gone: keep waiting
    append(`[app] could not open ${portName(port)}: ${e.message || e}`);
    if (e.name === "InvalidStateError") append("[app] (the port is already open - another tab or app, e.g. the Arduino monitor?)");
    return false;
  }
  if (again && waitPort !== port) { try { await port.close(); } catch {} return false; }  // stopped waiting meanwhile
  stopWaiting();
  serialPort = port;
  serialWriter = port.writable.getWriter();
  writeChain = Promise.resolve();
  const gen = startConnection({
    kind: "usb",
    write(text, command) {
      const w = serialWriter, data = enc.encode(text);
      writeChain = writeChain.then(() => w.write(data)).catch(e => {
        append(`[app] write failed (${command.startsWith("# p ") ? "# p …" : command}): ${e.message || e}`);
      });
    },
  }, `connected to ${portName(port)}`);
  readDone = readLoop(port, gen);
  return true;
}

async function readLoop(port, gen) {
  const decoder = new TextDecoder("utf-8");  // stream mode: a character split between two reads stays intact
  let buf = "";
  while (port.readable && gen === generation) {
    const reader = port.readable.getReader();
    serialReader = reader;
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (line && gen === generation) {
            try { handle(line); } catch (e) { console.error(e); }
          }
        }
        if (buf.length > 65536) buf = "";  // no newline for ages: garbage
      }
    } catch (e) {
      // Overrun / framing / break errors are not fatal (port.readable comes back); a pulled cable is.
      if (gen === generation && port.readable) append(`[app] read error (${e.name}), continuing`);
    } finally {
      try { reader.releaseLock(); } catch {}
    }
  }
  if (gen === generation && link && link.kind === "usb") lost(port);
}

async function closeSerial(port) {
  const reader = serialReader, writer = serialWriter, done = readDone;
  serialReader = serialWriter = readDone = null;
  serialPort = null;
  try { await reader?.cancel(); } catch {}
  try { await done; } catch {}
  try { await Promise.race([writeChain, new Promise(r => setTimeout(r, 500))]); } catch {}
  try { writer?.releaseLock(); } catch {}
  try { await port?.close(); } catch {}
}

function startConnection(l, what) {
  generation++;
  link = l;
  pendingDrawings = [];
  soulLines = null; soulOut = []; soulSent = 0;
  setConnected(true);
  append(`[app] ${what}`);
  // Ask for the lists and the state (again a little later: opening the port may reset the board).
  sendLater(0.4, "h");
  sendLater(3.0, "h");
  sendLater(3.6, "U", true);
  sendLater(4.2, "o d", true);
  sendLater(4.8, "@ app", true);  // settings incl. the brightness schedule
  sendLater(5.4, "@ ota", true);  // version and updates
  sendLater(6.0, "@ festive", true);  // holidays: country, birthdays, today
  clearInterval(poll);
  poll = setInterval(() => send("w", true), 1500);
  return generation;
}

function teardown() {
  generation++;
  clearTimeout(otaPoll);
  clearInterval(poll); poll = null;
  const l = link;
  link = null;
  soulLines = null; soulOut = []; setImportProgress();
  setConnected(false);
  return l;
}

async function disconnect() {
  const waiting = waitPort;
  stopWaiting();
  if (!B.connected) { if (waiting) append("[app] stopped waiting for the board"); setConnText(); return; }
  const l = teardown();
  if (l?.kind === "usb") await closeSerial(serialPort);
  if (l?.kind === "demo") demo.stop();
  append("[app] disconnected");
}

// The board went away (cable pulled, board reset): wait for it to come back and reconnect.
async function lost(port) {
  if (!B.connected) return;
  const l = teardown();
  append("[app] disconnected (cable pulled or the board restarted) – waiting for it to come back…");
  if (l?.kind === "demo") { demo.stop(); waitPort = "demo"; setConnText(); waitTimer = setTimeout(() => openDemo(true), 2500); return; }
  await closeSerial(port);
  waitPort = port;
  waitTries = 0;
  setConnText();
  scheduleRetry(1200);
}
let waitTries = 0, opening = false;
function scheduleRetry(ms) { clearTimeout(waitTimer); waitTimer = setTimeout(retryOpen, ms); }
async function retryOpen() {
  const port = waitPort;
  if (!port || port === "demo" || opening) return;
  opening = true;
  const ok = await openSerial(port, true);
  opening = false;
  if (ok || waitPort !== port) return;
  if (++waitTries < 60) scheduleRetry(2000);  // a reset board is usually back in 1-3 s
  else { stopWaiting(); append("[app] the board did not come back – connect again"); }
}
function stopWaiting() { clearTimeout(waitTimer); waitTimer = null; waitPort = null; setConnText(); }

if (serialSupported()) {
  navigator.serial.addEventListener("disconnect", e => { if (e.target === serialPort && B.connected) lost(serialPort); });
  navigator.serial.addEventListener("connect", e => {
    // The lost board is plugged in again (or came back after a reset): open it straight away.
    if (!waitPort || waitPort === "demo" || B.connected) return;
    const a = e.target.getInfo(), b = waitPort.getInfo();
    if (e.target === waitPort || (a.usbVendorId != null && a.usbVendorId === b.usbVendorId && a.usbProductId === b.usbProductId)) {
      waitPort = e.target;
      scheduleRetry(700);
    }
  });
}

// UI: header and connection
// The little eyes in the header: asleep while nothing is connected; on connecting they open and he
// is glad (eyes smiling, two hops); while connected he blinks now and then.
let blinkTimer = 0;
function headerEyes(woke) {
  const eyes = document.querySelector("header .eyes");
  clearTimeout(blinkTimer);
  if (!B.connected) { eyes.classList.remove("glad", "blink"); return; }
  if (woke) { eyes.classList.add("glad"); setTimeout(() => eyes.classList.remove("glad"), 1500); }
  const blink = () => {
    eyes.classList.add("blink"); setTimeout(() => eyes.classList.remove("blink"), 130);
    blinkTimer = setTimeout(blink, 2500 + Math.random() * 4500);
  };
  blinkTimer = setTimeout(blink, 2600 + Math.random() * 2000);
}
function setConnected(on) {
  B.connected = on;
  const woke = on && !document.body.classList.contains("online");
  document.body.classList.toggle("online", on);
  headerEyes(woke);
  $("status").classList.toggle("hidden", !on);
  for (const b of document.querySelectorAll("[data-needs]")) b.disabled = !on;
  updateGalleryButtons();
  setConnText();
}
function setConnText() {
  const t = $("connText"), b = $("connect");
  if (B.connected) { t.textContent = link?.kind === "demo" ? "Połączony z symulacją (bez płytki)" : "Połączony przez USB"; b.textContent = "Rozłącz"; b.classList.remove("primary"); }
  else if (waitPort) { t.textContent = "Płytka zniknęła – czekam, aż wróci…"; b.textContent = "Przestań czekać"; b.classList.remove("primary"); }
  else { t.textContent = "Niepołączony"; b.textContent = DEMO ? "Połącz (demo)" : "Połącz przez USB"; b.classList.add("primary"); }
}
function renderState() {
  const s = B.state;
  $("stMood").textContent = moodPL[s.mood] || s.mood || "–";
  $("stDrive").textContent = drivePL[s.drive] || s.drive || "–";
  $("stFace").textContent = emotionPL[s.face] || s.face || "–";
  $("stDriver").textContent = s.driver || "–";
  $("stFps").textContent = s.fps || "–";
  const m = $("modeTitle"); if (m) m.textContent = `Dźwięk (teraz: ${({ normal: s.muted === "1" ? "wyciszony" : "włączony", quiet: "bez dźwięku" })[s.mode] || "–"})`;
  const se = $("sensTitle"); if (se) se.textContent = `Wyczucie jazdy (czułość: ${s.sens ? Math.round(parseFloat(s.sens) * 100) + "%" : "–"})`;
  const le = $("learnBtn"); if (le) le.lastChild.textContent = s.learning === "1" ? "Uczy się – kliknij, żeby zatrzymać" : "Nie uczy się – kliknij, żeby włączyć";
  const te = $("tempBtn"); if (te) te.lastChild.textContent = s.sensor === "1" ? "Czujnik jest – czuje zimno i upał" : "Brak czujnika – kliknij, żeby poszukać";
  const nv = $("navTitle"); if (nv) nv.textContent = `Ostrzeżenia drogowe (teraz: ${({ yanosik: "Yanosik", waze: "Waze", both: "Yanosik i Waze" })[s.nav] || "–"})`;
}

// UI building blocks
function needs(btn) { btn.dataset.needs = "1"; btn.disabled = !B.connected; return btn; }
function cmdButton(label, onclick, cls = "small") { return needs(el("button", { class: cls, onclick }, label)); }
// A face preview: the GIF at first; once the live face (face/carbuddy-face.wasm) has loaded, his
// real face code draws it at the screen's frame rate - only while the card is on screen.
let faceLib = null;
const faceSlots = [];
function liveFace(slot) {
  if (!faceLib || !faceLib.has(slot.id) || slot.live) return;
  const canvas = el("canvas", { class: "screen" });
  slot.img.replaceWith(canvas);
  slot.live = faceLib.view(canvas, { clip: slot.id, loop: true, onlyVisible: true });
}
function faceImg(id) {
  const img = el("img", { class: "screen", src: `faces/${id}.gif`, alt: "", loading: "lazy", decoding: "async" });
  img.onerror = () => { img.style.visibility = "hidden"; };
  const slot = { id, img, live: null };
  faceSlots.push(slot);
  liveFace(slot);
  return el("div", { class: "bezel" }, img);
}
if (window.CarBuddyFace) {
  CarBuddyFace.load("face/").then(f => {
    faceLib = f;
    faceSlots.forEach(liveFace);
    startVirtual();
  }).catch(() => {});  // e.g. opened from file://: the GIFs stay
}
// The demo's virtual CarBuddy: plays what the simulated board shows (its "[state] face=").
let virtual = null, virtualFace = "";
function startVirtual() {
  if (!DEMO || !faceLib) return;
  $("vscreen").classList.remove("hidden");
  virtual = faceLib.view($("vcanvas"), { clip: "neutral", loop: true });
}
function showVirtual(name, resting) {
  if (!virtual || !name || name === virtualFace) return;
  virtualFace = name;
  if (!faceLib.has(name)) return;
  if (name === resting || !faceLib.has(resting)) virtual.play(name, { loop: true });
  else virtual.play(name, { loop: false, then: resting, hold: 300 });
}

      command ? cmdButton("▶ Wywołaj", () => send(command), "primary small go") : null));
}
function actionGroup(title, actions) {
  return el("section", {}, el("h2", { text: title }), el("div", { class: "grid actions" }, actions.map(actionCard)));
}
const A = (title, command, face, what, when) => {

  const sec = el("section", {}, el("h2", { text: "Jasność ekranu", id: "briTitle" }),
    el("p", { class: "note", text: "„Według słońca” – w dzień pełna jasność, o zmierzchu powoli przygasa, w nocy świeci słabo; godziny zmierzchu liczy sam dla Twojej strefy czasowej, przez cały rok. „Własne godziny” – od której godziny jak jasno. „Stała” – zawsze tak samo." }),
    el("div", { class: "btnrow" },
      needs(el("button", { id: "briSun", onclick: () => send("@ bri sun") }, "Według słońca")),
      needs(el("button", { id: "briAuto", onclick: () => send("@ bri auto") }, "Własne godziny")),
      needs(el("button", { id: "briFixed", onclick: () => send(`@ bri fixed ${$("briLevel").value}`) }, "Stała")),

                    onchange: (e) => send(`@ bri fixed ${e.target.value}`) }),
      el("span", { id: "briLevelV", text: "100%" })),
    el("div", { class: "btnrow" }, el("span", { text: "Gdy śpi, świeci na" }),
      el("input", { type: "number", id: "briSleep", min: 0, max: 100, step: 5, value: 60, style: "width:4.5em",
                    onchange: (e) => send(`@ bri sleep ${Math.max(0, Math.min(100, +e.target.value || 0))}`) }),
      el("span", { text: "% (100 = nie przygasa)" })),
    el("div", { id: "briSlots", class: "slots" }));

function renderBrightness() {
  const b = B.bri || {};
  const how = { sun: "według słońca", auto: "własne godziny", fixed: "stała" }[b.mode] || "–";
  const t = $("briTitle"); if (t) t.textContent = `Jasność ekranu (${how}, teraz ${b.now || "–"}%)`;
  const sun = $("briSun"), a = $("briAuto"), f = $("briFixed");
  if (sun) sun.classList.toggle("on", b.mode === "sun");
  if (a) a.classList.toggle("on", b.mode === "auto");
  if (f) f.classList.toggle("on", b.mode === "fixed");
  // The hours matter only in their own mode (and by the sun until the time zone is known).
  $("briSlots")?.classList.toggle("hidden", !(b.mode === "auto" || (b.mode === "sun" && b.sun === "unknown")));
  if (b.sleep && document.activeElement !== $("briSleep")) $("briSleep").value = b.sleep;
  if (b.fixed && document.activeElement !== $("briLevel")) { $("briLevel").value = b.fixed; $("briLevelV").textContent = b.fixed + "%"; }
  const box = $("briSlots"); if (!box || !b.slots) return;
  if (box.contains(document.activeElement)) return;  // don't redraw under the owner's fingers
  box.textContent = "";
  b.slots.split(",").forEach((s, i) => {
    const [hm, lvl] = s.split("/");
    const time = el("input", { type: "time", value: hm });
    const level = el("input", { type: "number", min: 0, max: 100, step: 5, value: lvl, style: "width:4.5em" });

      needs(el("button", { onclick: () => send(`@ bri slot ${i} ${time.value} ${Math.max(0, Math.min(100, +level.value || 0))}`) }, "Zapisz"))));
  });
}

function saveOtaWifi() {
  const ssid = $("otaSsid").value.trim(), pass = $("otaPass").value;
  if (!ssid) { toast("Wpisz nazwę sieci"); return; }
  if (ssid.includes("|")) { toast("Nazwa sieci nie może zawierać znaku |"); return; }
  send(`@ ota wifi ${ssid}|${pass}`, true);  // the password never goes to the log
  append(`> @ ota wifi ${ssid}|${pass ? "••••" : ""}`);

function renderOta() {
  const o = B.ota, st = parseInt(o.state) || 0;
  const t = $("otaTitle"); if (t) t.textContent = `Aktualizacja oprogramowania (wersja ${o.version || "–"})`;
  let line = `Na płytce: ${o.version || "–"} (kompilacja ${o.build || "–"}, płytka ${o.board || "–"}). Wi-Fi do aktualizacji: ${o.wifi && o.wifi !== "-" ? o.wifi : "nieustawione"}.`;
  if (st) {
    line += ` Teraz: ${otaStatePL[st] || "–"}`;
    if (st === 3) line += ` ${o.new && o.new !== "-" ? o.new + " " : ""}(${o.progress || "0%"})`;
    if (st === 7) line += ` – ${otaMsgPL[o.msg] || o.msg}`;

}

// --- Galeria min
let catalog = null, faceNumbers = {};
// What "show on CarBuddy" sends for previews that are not a plain face (as in the Mac app).
function commandFor(id) {
  const i = B.emotions.indexOf(id);
  if (i >= 0) return `E ${i}`;
  switch (id) {
    case "x-star": return "C 1";
    case "x-cake": return "C 2";
    case "x-trophy": return "C 3";
    case "x-hide": { const a = B.acts.indexOf("hide and seek"); return a >= 0 ? `D ${a}` : null; }
    case "x-dance-rap": return "G 1";
    case "x-dance-techno": return "G 2";
    case "x-dance-pop": return "G 3";
    case "x-dance-rock": return "G 4";
    case "x-dance-chill": return "G 5";
    case "x-phone-star": return "V";
    case "y-radar": return "y 0 600";
    case "y-police": return "y 1 500";
    case "y-accident": return "y 2 200";
    case "y-roadworks": return "y 3 900";
    case "y-jam": return "y 4 100";
    case "y-danger": return "y 5 500";
    case "y-unmarked": return "y 6 600";
    case "y-stopped": return "y 7 300";
    default: return id.startsWith("f-") ? `@ festive ${id.slice(2)}` : null;
  }
}
const galleryButtons = [];
function buildGallery() {
  if (!catalog) {
    panels.gallery.append(el("p", { class: "note", text: "Nie ma jeszcze podglądów min – zbuduj je skryptem tools/CarBuddyPanel/build.sh." }));
    return;
  }
  catalog.groups.flatMap(g => g.ids).forEach((id, i) => { if (!(id in faceNumbers)) faceNumbers[id] = i + 1; });
  for (const g of catalog.groups) {
    const grid = el("div", { class: "grid gallery" });
    for (const id of g.ids) {
      const info = catalog.faces[id];
      if (!info) continue;
      const btn = el("button", { class: "primary small go hidden", onclick: () => { const c = commandFor(id); if (c) send(c); } }, "▶ Pokaż na CarBuddy");
      btn.dataset.face = id;
      galleryButtons.push(btn);
      grid.append(el("div", { class: "fcard" },
        faceImg(id),
        el("div", { class: "head" }, el("span", { class: "badge", text: faceNumbers[id] || 0 }), el("b", { text: info.name })),
        el("div", { class: "id", text: id }),
        el("div", { text: info.meaning }),
        el("div", { class: "when" }, el("small", { text: "KIEDY" }), el("span", { text: info.when })),
        btn));
    }
    panels.gallery.append(el("section", {}, el("h2", {}, g.title, el("span", { class: "count", text: g.ids.length })), grid));
  }
}
function updateGalleryButtons() {
  for (const b of galleryButtons) b.classList.toggle("hidden", !(B.connected && commandFor(b.dataset.face)));
}

// One of his drawings, as sent by the board: the pen path he really drew.
function parseDrawing(line) {
  const d = {};
  for (const part of line.slice(10).split(" ")) { const i = part.indexOf("="); if (i > 0) d[part.slice(0, i)] = part.slice(i + 1); }
  const total = parseInt(d.total), outcome = parseInt(d.outcome);
  if (isNaN(total) || isNaN(outcome) || d.pts == null) return null;
  return {
    id: total, minute: parseInt(d.minute) || 0, outcome, level: parseInt(d.level) || 0, temper: parseInt(d.temper) || 0,
    points: d.pts.split(";").map(p => p.split(",")).filter(v => v.length === 3 && v[0] !== "" && v[1] !== "" && !isNaN(+v[0]) && !isNaN(+v[1]))
      .map(v => ({ x: +v[0], y: +v[1], down: v[2] === "1" })),
  };
}
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
function drawingTitle(d) { return ["Serce", "Gwiazdka (nie domknęła się)", "Autoportret"][clamp(d.outcome, 0, 2)]; }
function drawingLevel(d) { return ["nowicjusz", "wprawny", "mistrz"][clamp(d.level, 0, 2)]; }
// How he took it (Hobby.h): proud of a heart, smitten with himself; a failed star by mood.
function drawingReaction(d) {
  if (d.outcome === 0) return "dumny 😊";
  if (d.outcome === 2) return "zakochany w sobie 😍";
  return ["zdziwiony, potem śmiech 😅", "śmiał się 😆", "obraził się na nią 😤", "sprawdzał, czy widziałeś 🙈"][clamp(d.temper, 0, 3)];
}
const drawFmt = new Intl.DateTimeFormat("pl-PL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "UTC" });
function drawingWhen(d) {
  if (d.minute <= 0) return "bez daty (zegar nie był ustawiony)";
  return drawFmt.format(new Date(d.minute * 60000));  // the board keeps local time: shown as is
}
function paint(canvas, d) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // His drawing area is about 100 x 90 px around (120, 232) on his screen.
  const k = Math.min(w / 110, h / 95);
  ctx.beginPath();
  let prev = false;
  for (const p of d.points) {
    const x = w / 2 + (p.x - 120) * k, y = h / 2 + (p.y - 232) * k;
    if (p.down && prev) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    prev = p.down;
  }
  ctx.strokeStyle = "rgb(255,235,199)";
  ctx.lineWidth = 3.2 * k; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.stroke();
}
const paperObserver = new ResizeObserver(entries => { for (const e of entries) if (e.target._drawing) paint(e.target, e.target._drawing); });
function renderDrawings() {
  const t = B.drawings.total, list = B.drawings.list;

  for (const c of drawingsGrid.querySelectorAll("canvas")) paperObserver.unobserve(c);
  drawingsGrid.replaceChildren(...list.map(d => {

    return el("div", { class: "dcard" },

      el("b", { text: drawingTitle(d) }),

    input.addEventListener("pointerdown", () => { r.dragging = true; });

    input.addEventListener("change", () => { r.dragging = false; r[key] = +input.value; show();
      send(`U ${p} ${r.style} ${Math.round(r.shy)} ${Math.round(r.romance)} ${Math.round(r.showoff)}`); });
    input.addEventListener("blur", () => { r.dragging = false; });

  const row = el("div", { class: "rel" },

// Log: kept in memory only (never stored), at most 2000 lines
const logLines = [];
let logQueue = [];
let filter = "";
function lineClass(l) { return l.startsWith(">") ? "out" : l.startsWith("[app]") ? "app" : (l.startsWith("[act]") || l.startsWith("[react]")) ? "hl" : ""; }
function append(line) {
  logLines.push(line);
  if (logLines.length > 2000) logLines.splice(0, logLines.length - 2000);
  logQueue.push(line);
  if (logQueue.length === 1) requestAnimationFrame(flushLog);
}
function flushLog() {
  const box = $("log");
  const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const f = filter.toLocaleLowerCase();
  const frag = document.createDocumentFragment();
  for (const l of logQueue) if (!f || l.toLocaleLowerCase().includes(f)) frag.append(el("div", { class: lineClass(l), text: l }));
  logQueue = [];
  box.append(frag);
  while (box.childElementCount > 2000) box.firstChild.remove();
  if (atEnd) box.scrollTop = box.scrollHeight;
}
function rebuildLog() {
  logQueue = [];
  const f = filter.toLocaleLowerCase(), box = $("log");
  box.replaceChildren(...logLines.filter(l => !f || l.toLocaleLowerCase().includes(f)).map(l => el("div", { class: lineClass(l), text: l })));
  box.scrollTop = box.scrollHeight;
}
$("filter").addEventListener("input", e => { filter = e.target.value; clearTimeout(rebuildLog.h); rebuildLog.h = setTimeout(rebuildLog, 120); });

      return `[soul] imported ${n} entries, restarting`;
    }
    return null;
  }
  function decide(event, value, options) {
    const r = pick(options);
    const m = `mood v+${f2(0.2 + rand() * 0.4)} a${f2(0.3 + rand() * 0.3)} e${f2(0.5 + rand() * 0.3)} b${f2(rand() * 0.3)} stress${f2(rand() * 0.3)}`;
    out([`[decide] ${event}(${f2(value)}) ${m} | ${options.map((o, i) => `${o[0]} ${[57, 24, 11, 8][i] || 5}%`).join(", ")} -> ${r[0]}`, `[react] ${r[0]} (${event})`]);
    showFace(r[1]);
  }
  function play(h, outcome) {
    const o = outcome >= 0 && outcome <= 2 ? outcome : Math.floor(rand() * 3);
    s.playing = h; s.asleep = 0;
    out(`[hobby] ${HOBBY[h]}: ${OUTCOMES[h][o]} (interest ${f0(s.hobbies[h].interest)})`, 300);
    later(4500, () => {
      s.playing = -1;
      const st = s.hobbies[h]; const before = level(st.plays);
      st.plays++; st.interest = Math.min(100, st.interest + 1.5);
      s.dreams[h] = Math.min(1, s.dreams[h] + 0.3);
      if (h === 4) s.drawings.push({ minute: localMinute(new Date()), outcome: o, level: before, temper: Math.floor(rand() * 4), seed: Math.floor(rand() * 1000) });
      if (h === 6) { s.garden.water = 1; s.garden.dry = 0; }
      const lines = [];
      if (level(st.plays) > before) lines.push(`[hobby] ${HOBBY[h]}: now ${["novice", "practised", "master"][level(st.plays)]}`);
      lines.push(`[hobby] ${HOBBY[h]} done (interest now ${f0(st.interest)})`);
      out(lines, 0);
    });
  }

  function command(line) {
    const c = line[0], rest = line.slice(1).trim();
    const num = parseInt(rest);
    switch (c) {
      case "w": out([stateLine(), hobbiesLine(), "[dreams] dreaming=" + (s.dreaming >= 0 ? MOTIFS[s.dreaming] : "-") + MOTIFS.map((m, i) => ` ${m}=${f2(s.dreams[i])}`).join(""), gardenPoll()], 25); break;
      case "h": out([`[emotions] ${EMOTIONS.join("|")}`, `[acts] ${ACTS.join("|")}`, `[moods] ${MOODS.join("|")}`]); break;
      case "U": {
        const m = rest.match(/^(\d+)\s+(.*)$/);
        const p = m ? +m[1] : -1;
        if (m && p >= 0 && p < PEOPLE) {
          const args = m[2].trim();
          if (args.startsWith("gif")) s.gift = p;
          else if (args.startsWith("away")) { /* last met moved back */ }
          else {
            const v = args.split(/\s+/).map(Number);
            if (v[0] >= 0 && v[0] < 4) {
              const def = [[30, 10, 40], [60, 80, 60], [20, 0, 30], [80, 20, 10]][v[0]];
              const r = { style: v[0], shy: def[0], romance: def[1], showoff: def[2] };
              if (v.length === 4) { r.shy = clamp(v[1], 0, 100); r.romance = clamp(v[2], 0, 100); r.showoff = clamp(v[3], 0, 100); }
              s.rel[p] = r;
              showFace(v[0] === 1 ? "dreamy" : "joy", 2);
            }
          }
        }
        out(relationLines());
        break;
      }
      case "o":
        if (rest.startsWith("d")) out(drawingLines(), 60);
        else if (isNaN(num)) out(s.hobbies.map((h, i) => `[hobby] ${HOBBY[i]}: interest ${f0(h.interest)}, familiarity ${f0(h.plays * 3)}, played ${h.plays} times (${["novice", "practised", "master"][level(h.plays)]}), last: -`));
        else if (num >= 0 && num < 7) play(num, parseInt(rest.split(/\s+/)[1]));
        break;
      case "m":
        if (rest.startsWith("!") || !isNaN(num)) {
          const motif = rest.startsWith("!") ? s.dreams.indexOf(Math.max(...s.dreams)) : clamp(num, 0, 9);
          s.dreaming = motif; s.asleep = 1;
          out(`[dream] ${MOTIFS[motif]}${rest.split(/\s+/)[1] ? " + " + MOTIFS[clamp(+rest.split(/\s+/)[1], 0, 9)] : ""}`, 200);
          later(8000, () => { s.dreaming = -1; });
        } else out(s.dreams.map((v, i) => v > 0 ? `[dream] remembers ${MOTIFS[i]}: ${f2(v)}` : "").filter(Boolean));
        break;
      case "z": {
        const days = parseFloat(rest);
        const g = s.garden, lines = [];
        if (days > 0) {
          const wet = Math.min(days, g.water * 2);
          g.growth = Math.min(1, g.growth + wet * (g.cactus ? 0.02 : 0.04)); g.water = Math.max(0, g.water - days / 2);
          if (g.water === 0) g.dry += days - wet;
          if (g.growth >= 1) g.bloom += days;
          lines.push(`[garden] ${days.toFixed(1)} day(s) later`);
        }
        lines.push(gardenPrint());
        out(lines);
        break;
      }
      case "@":
        if (rest.startsWith("app")) out([...s.names.map((n, i) => `[driver] p=${i} active=${s.driver === i ? 1 : 0} phones=${s.phones[i]} phone=${i === 0 ? 1 : 0} name=${n}`), "[app] subscribed=0 queued=0 sent=0 failed=0", settingsLine(), briLine()]);
        else if (rest.startsWith("driver")) { s.driver = clamp(parseInt(rest.slice(6)) || 0, 0, 2); out(`[memory] driver now ${s.names[s.driver]}`); }
        else if (rest.startsWith("bri")) {
          const a = rest.slice(3).trim().split(/\s+/);
          if (a[0] === "auto") s.briAuto = 1; else if (a[0] === "fixed") { s.briAuto = 0; s.briFix = +a[1]; }
          else if (a[0] === "sleep") s.briSleep = +a[1];
          else if (a[0] === "slot") { s.slots[+a[1]] = `${a[2]}/${a[3]}`; s.slots.sort(); }
          out(briLine());
        }
        else if (rest.startsWith("nav")) { const v = rest.slice(3).trim(); if (["yanosik", "waze", "both"].includes(v)) s.nav = v; out(settingsLine()); }
        else if (rest.startsWith("ota")) {
          const a = rest.slice(3).trim();
          if (a.startsWith("wifi ")) s.ota.wifi = a.slice(5).split("|")[0];
          if (a === "check") {
            if (!s.ota.wifi) { out("[ota] set the Wi-Fi first: @ ota wifi <name>|<password>"); break; }
            s.ota.state = 1; s.ota.msg = `connecting to ${s.ota.wifi}`;
            later(1500, () => { s.ota.state = 2; s.ota.msg = "checking for a new version"; });
            later(3500, () => { s.ota.state = 5; s.ota.msg = "up to date (0.7.0)"; });
          }
          out(otaLine());
        }
        else if (rest.startsWith("festive")) {
          const a = rest.slice(7).trim();
          if (a) { showFace("joy", 6); s.asleep = 0; }
          out(festiveLine(a === "today" ? festiveToday() : a));
        }
        else if (rest.startsWith("country")) s.country = rest.slice(7).trim() || "pl";
        else if (rest.startsWith("birthday")) {
          const m = rest.slice(8).trim().match(/^(\d)\s+(\d+)(?:-(\d+))?/);
          if (m && +m[1] < PEOPLE) s.birthdays[+m[1]] = m[3] ? +m[2] * 100 + +m[3] : 0;
        }
        else out(`[app] ${rest.split(" ")[0]}: ok`);
        break;
      case "#": {
        if (rest.startsWith("export")) out(soulExport(), 150);
        else { const r = soulImport(rest); if (r) out(r, 15); }
        break;
      }
      case "E": if (num >= 0 && num < EMOTIONS.length) { showFace(EMOTIONS[num]); s.asleep = 0; out(`[emotion] ${EMOTIONS[num]}`); } break;
      case "D": if (num >= 0 && num < ACTS.length) {
        const f = (actInfo[ACTS[num]] || [0, "curious"])[1]; showFace(EMOTIONS.includes(f) ? f : "curious", 5); s.asleep = 0;
        out(`[act] ${ACTS[num]} (${(3 + rand() * 4).toFixed(1)}s)`);
        if (ACTS[num].startsWith("hobby: ")) play(ACTS.indexOf(ACTS[num]) - 20, -1); else later(5000, () => out(`[act] ${ACTS[num]} done`, 0));
      } break;
      case "S": if (num >= 0 && num < MOODS.length) { s.mood = num; out(`[mood] now ${MOODS[num]} (console; v+0.31 e0.62 b0.12 over minutes)`); } break;
      case "b": decide("brake", 0.82, [["scared", "scared"], ["reproach", "reproach"], ["startled", "startled"]]); break;
      case "a": decide("accel", 0.64, [["excited", "excited"], ["strain", "strain"]]); break;
      case "k": decide("bump", 0.70, [["ouch", "ouch"], ["surprised", "surprised"], ["annoyed", "annoyed"], ["excited", "excited"]]); break;
      case "d": decide("roundabout", 0.75, [["dizzy", "dizzy"]]); break;
      case "x": decide("shaken", 0.90, [["dizzy then angry", "dizzy"], ["rattled", "rattled"]]); break;
      case "j": s.drive = "city"; decide("moving", 0.0, [["eyes on the road", "attentive"]]); later(20000, () => { s.drive = "parked"; }); break;
      case "1": decide("tap", 0.0, [["joy", "joy"], ["curious", "curious"]]); s.asleep = 0; break;
      case "2": decide("double tap", 0.0, [["curious + wink", "curious"]]); break;
      case "3": s.muted ^= 1; out(`[sound] ${s.muted ? "muted" : "on"}`); showFace("sleepy", 2); break;
      case "p": decide("petting", 0.0, [["petted", "petted"]]); break;
      case "g": out(["[greeting] hi (away 0.4 days)", "[act] greeting (6.0s)"]); showFace("hi", 6); s.asleep = 0; break;
      case "s": s.asleep = 1; out("[sleep] falling asleep"); break;
      case "5": case "6": s.mode = +c - 5; break;
      case "+": case "-": s.sens = clamp(s.sens * (c === "+" ? 1.25 : 0.8), 0.25, 4); out(settingsLine()); break;
      case "c": out("[imu] mount calibration cleared - learning it again"); break;
      case "u": s.learning ^= 1; out(`[settings] learning ${s.learning ? "on" : "off"}`); break;
      case "H": out(`[temp] cabin forced: ${pick(["32", "6", "nan"])} C`); break;
      case "T": out(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(rest) ? "[rtc] clock set" : "[rtc] expected T YYYY-MM-DD HH:MM:SS"); break;
      case "W": out("[portal] settings Wi-Fi open: CarBuddy-setup (QR on screen)"); break;
      case "i": out([`[mood] v+0.38 a0.41 e0.66 aff0.52 bored0.18 | reactivity 1.04 tempo 0.92 asleep ${s.asleep} resting ${RESTING[s.mood]}`, settingsLine()]); break;
      case "I": out(s.names.map((n, i) => `[memory] p${i} ${n}: trips ${[42, 7, 1][i]}, bond ${["0.71", "0.38", "0.05"][i]}, harsh ${["0.18", "0.31", "0.00"][i]}${i === s.driver ? " (active)" : ""}`)); break;
      case "P": s.driver = (s.driver + 1) % PEOPLE; out(`[memory] driver now ${s.names[s.driver]}`); break;
      case "K": out(`[phone] pairing open for ${s.names[s.driver]} (2 min)`); break;
      case "J": s.phones[s.driver] = 0; out(`[phone] forgot the phones of ${s.names[s.driver]}`); break;
      case "q": decide("call", 0.0, [["attentive", "attentive"]]); break;
      case "n": decide("notification", 4.0, [["curious", "curious"], ["ignore", "neutral"]]); break;
      case "M": decide("music", 0.0, [["dances", "happy"], ["sways", "relaxed"]]); break;
      case "N": decide("track", 0.0, [["new dance decision", "curious"]]); break;
      case "V": { if (num >= 0 && num < PEOPLE) s.driver = num; out(`[rel] ${s.names[s.driver]} arrived: usual`); showFace("joy", 3); break; }
      case "C": out(`[celebrate] ${["star", "cake", "trophy"][clamp((num || 1) - 1, 0, 2)]}`); break;
      case "Q": s.mood = (s.mood + 1) % MOODS.length; out(`[mood] now ${MOODS[s.mood]} (console)`); break;
      case "A": out(`[act] ${pick(ACTS)} (4.0s)`); break;
      case "O": out(`[rel] meet as: ${pick(["jealous", "stranger", "usual"])}`); break;
      case "G": { const g = GENRES[num >= 1 && num <= 5 ? num : 1 + Math.floor(rand() * 5)]; out(`[music] dancing: ${g}`); showFace(`x-dance-${g}`, 8); break; }
      case "L": case "R": case "F": case "B": out(`[gforce] ${({ L: "left", R: "right", F: "braking", B: "accelerating" })[c]} 2 s`); showFace(({ L: "gforce-left", R: "gforce-right", F: "gforce-brake", B: "gforce-accel" })[c], 3); break;
      case "l": case "r": decide("turn", 0.4, [["lean", "strain"]]); break;
      case "v": out([`[yanosik] ${s.yanosik.length} saved notification(s)`, ...s.yanosik.map(([w, cat, t, m]) => `[yanosik] ${w} | cat ${cat} | ${t} | ${m}`)]); break;
      case "f": s.yanosik = []; out("[yanosik] log cleared"); break;
      case "y": if (num >= 0 && num < 8) { out(`[yanosik] alert: ${YANO[num]} ${parseInt(rest.split(/\s+/)[1]) || 600} m`); showFace("attentive", 3); } break;
      case "e": out(`[emotion] ${pick(EMOTIONS)}`); break;
      case "t": s.telemetry = !s.telemetry; break;
      case "~": out(`[beat] ${rest || "off"}`); break;
      case "X": case "Y": case "Z": case "!": out(rest.startsWith("YES") ? "[console] (demo: nothing erased)" : `[console] ${c} erases data: send "${c} YES" to confirm`); break;
      default: out(["CarBuddy console (events go through the same path as real sensors):",
        "  b brake  a accelerate  l/r turn  k bump  d roundabout  x shaken  j moving again",
        "  (demo board: the full help is in README.md, \"Serial console\")"]);
    }
  }
  function tick() {  // time passes on the demo board
    s.garden.water = Math.max(0, s.garden.water - 0.002);
    s.dreams = s.dreams.map(v => Math.max(0, v - 0.0005));
    if (rand() < 0.04) out(`[decide] idle mood v+0.40 a0.35 | glance 40%, look at driver 30%, nothing 30% -> ${pick(["glance", "look at driver", "nothing"])}`, 0);

  }
  function start() {
    running = true; timers = [];
    out(["ESP-ROM:esp32s3-20210327", "[boot] CarBuddy (demo board: no hardware, the answers are simulated)", `[memory] driver ${s.names[s.driver]}, 42 trips together`, "[display] 240x280 ready"], 120);
    timers.push(setTimeout(tick, 1500));
  }
  function stop() { running = false; timers.forEach(clearTimeout); timers = []; }
  function lost() { if (B.connected && link?.kind === "demo") window.__demoLost(); }
  // A command that a card or the gallery stands for plays that card's animation on the virtual
  // screen - the exact one, not just a matching mood.
  function commandShown(line) {
    command(line);
    const cmd = line.trim(), f = faceForCommand[cmd] || (catalog ? catalog.groups.flatMap(g => g.ids).find(id => commandFor(id) === cmd) : null);
    if (f && faceLib && faceLib.has(f)) showFace(f, 6);
  }
  return { start, stop, write: line => commandShown(line), lost };
})();
window.__demoLost = () => lost(null);
function openDemo(again = false) {
  if (!DEMO) return;
  stopWaiting();
  startConnection({ kind: "demo", write: (text) => { const l = text.replace(/\n$/, ""); setTimeout(() => demo.write(l), 5); } },
    again ? "connected to the demo board again (it restarted)" : "connected to the demo board (simulation, no hardware)");
  demo.start();
}

// ---------------------------------------------------------------------------------------------
// Start
async function loadCatalog() {
  if (window.CARBUDDY_FACES) return window.CARBUDDY_FACES;
  try { const r = await fetch("faces.json"); if (r.ok) return await r.json(); } catch {}
  return null;
}
// Per driver: "Sparuj telefon", or "Sparowano" once a phone is paired to them.
function renderPhones() {
  for (const p of EVERYONE) { const nm = $(`nmName${p}`); if (nm && B.drivers[p]?.name) nm.textContent = B.drivers[p].name; }
  for (const p of EVERYONE) {
    const btn = $(`pairBtn${p}`), forget = $(`forgetBtn${p}`);
    if (!btn) continue;
    const phones = parseInt(B.drivers[p]?.phones) || 0;
    const pairing = B.pairing && B.pairing.p === p && Date.now() < B.pairing.until;
    btn.textContent = pairing ? "Paruję… (kliknij, żeby przerwać) – na iPhonie: Ustawienia → Bluetooth → CarBuddy" : phones ? "Sparowano ✓" : "Sparuj telefon";
    btn.classList.toggle("on", phones > 0 && !pairing);
    btn.classList.toggle("primary", !phones && !pairing);
    btn.dataset.paired = phones && !pairing ? "1" : "";
    forget.classList.toggle("hidden", !phones || pairing);
  }
}

// The owner's panel lists nothing of what he can do - finding that out on the road is the fun.
// Only his people, the phone and the settings; "?dev" (or "?demo") shows the whole catalogue.
function applyView() {
  if (DEV || DEMO) return;
  const prog = LEVEL === "prog";
  if (!prog) document.body.classList.add("owner");
  const keep = prog ? ["phone", "relations", "yanosik", "settings"] : ["relations", "settings"];
  for (const b of [...$("tabs").children]) if (!keep.includes(b.dataset.tab)) b.remove();
  const label = { phone: "Telefon", relations: "Kierowcy", yanosik: "Yanosik", settings: "Ustawienia" };
  for (const b of $("tabs").children) b.textContent = label[b.dataset.tab];
  // Programmer: the real phone and Yanosik's saved notifications stay; nothing that plays a behaviour.
  [...panels.phone.children].slice(0, -1).forEach(n => n.remove());  // only "Prawdziwy telefon"
  [...panels.yanosik.children].forEach(n => { if (/Zdarzenia/.test(n.querySelector("h2")?.textContent || "")) n.remove(); });
  [...panels.relations.children].slice(1).forEach(n => n.remove());  // only who is who
  const rel = panels.relations.firstElementChild;
  rel.querySelector("h2").textContent = "Kim jest dla niego każda osoba";
  rel.querySelector(".note").textContent = "Wybierz, kim jest dla niego każda osoba. Jak się przy niej zachowa, decyduje już on sam – im więcej wspólnych tras, tym bardziej się przywiązuje.";
  rel.querySelectorAll(".sliders").forEach(n => n.remove());  // how he behaves is his own business
  rel.querySelectorAll(":scope > .btnrow").forEach(n => n.remove());  // "Odśwież (U)": it refreshes by itself
  panels.relations.prepend(el("section", {}, el("h2", { text: "Kierowcy" }),
    el("p", { class: "note", text: "Imię – tak nazywa kierowcę w panelu i w urodziny. Telefon – po nim CarBuddy poznaje, kto jedzie: kliknij „Sparuj telefon”, a potem w ciągu 2 minut na iPhonie wejdź w Ustawienia → Bluetooth → CarBuddy. Bez komputera: przytrzymaj palec na jego ekranie przez 10 sekund – telefon trafi do następnego kierowcy." }),
    el("div", { class: "slots" }, EVERYONE.map(p => {
      const name = el("input", { maxlength: 22, placeholder: "nowe imię", style: "width:11em" });
      const save = () => { const v = name.value.replace(/[\r\n|]/g, " ").trim(); if (!v) return; send(`@ name ${p} ${v}`); sendLater(0.3, "U", true); sendLater(0.6, "@ app", true); name.value = ""; toast("Zapisano imię"); };
      const pair = needs(el("button", { id: `pairBtn${p}`, class: "primary", onclick: () => {
        if ($(`pairBtn${p}`).dataset.paired) return;  // already paired: "Sparowano"
        if (B.pairing && B.pairing.p === p && Date.now() < B.pairing.until) { send("@ pair stop"); B.pairing = null; renderPhones(); return; }
        send(`@ pair ${p}`);
      } }, "Sparuj telefon"));
      const forget = needs(el("button", { id: `forgetBtn${p}`, class: "hidden", title: "Usuń sparowany telefon", onclick: () => {
        if (confirm(`Usunąć telefon kierowcy ${B.relations[p]?.name || defaultNames[p]}? Trzeba będzie sparować go od nowa.`)) { send(`@ forget ${p}`); sendLater(0.5, "@ app", true); }
      } }, "Usuń telefon"));
      return el("div", { class: "slotrow" }, el("span", { id: `nmName${p}`, text: defaultNames[p], style: "min-width:8em;font-weight:600" }), name,
        needs(el("button", { onclick: save }, "Zmień imię")), pair, forget);
    }))));
  renderPhones();
  for (const p of [panels.relations, panels.settings])
    p.querySelectorAll("button").forEach(b => { if (/^\s*(🧪\s*)?Test/.test(b.textContent)) b.remove(); });
  if (!keep.includes(tab)) tab = "relations";
}
(async () => {
  if (DEMO) { $("demoTag").classList.remove("hidden"); document.title = "CarBuddy Panel (demo)"; }
  else if (!serialSupported()) { $("noSerial").classList.remove("hidden"); $("connect").disabled = true; }
  catalog = await loadCatalog();
  buildGallery();
  renderActs(); renderMoods(); renderHobbies(); renderDreams(); renderGarden(); renderDrawings(); renderState();
  setConnected(false);
  applyView();
  showTab(tab);
  append(DEMO ? "[app] demo mode: press „Połącz (demo)” – a simulated board answers like the real one"
              : serialSupported() ? "[app] connect the board with a USB cable and press „Połącz przez USB”" : "[app] Web Serial is missing in this browser: use Chrome or Edge");
})();
</script>
